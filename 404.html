<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Studio Emma Cochet</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <script>
      // GitHub Pages serves this file for every unknown URL (spa-github-pages trick).
      // Unprefixed or wrong-language URLs (/projects/x, /about, /mobilier ...) are rewritten to
      // their locale-prefixed equivalent. Keep in sync with sectionSlugs in lib/i18n/config.ts.
      (function () {
        var locales = ["fr", "en"];
        var sections = [
          { fr: "projects", en: "projects" },
          { fr: "mobilier", en: "furniture" },
          { fr: "contact", en: "contact" },
          { fr: "a-propos", en: "about" },
        ];
        var parts = window.location.pathname.split("/").filter(Boolean);
        if (parts.length && locales.indexOf(parts[0]) !== -1) return; // real 404 inside a locale

        var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
        var lang = "en";
        for (var i = 0; i < prefs.length; i++) {
          var code = String(prefs[i]).toLowerCase().split("-")[0];
          if (locales.indexOf(code) !== -1) { lang = code; break; }
        }
        var first = parts.shift();
        if (first) {
          var match = sections.filter(function (s) {
            return s.fr === first || s.en === first;
          })[0];
          parts.unshift(match ? match[lang] : first);
        }
        var target = "/" + [lang].concat(parts).join("/") + "/";
        window.location.replace(target + window.location.search + window.location.hash);
      })();
    </script>
  </head>
  <body style="font-family: Helvetica, Arial, sans-serif; padding: 2rem">
    <p>Page introuvable / Page not found.</p>
    <p><a href="/fr/">Accueil</a> · <a href="/en/">Home</a></p>
  </body>
</html>
